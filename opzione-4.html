function opt(v, label, cur){ return `<option value="${esc(v)}"${v===cur?' selected':''}>${esc(label)}</option>`; }
function filtersHTML(){
  return `<div class="filters">
   <label class="fl"><span>Genere</span><select id="f-genre">${opt('','Tutti i generi',st.genre)}${GENRES.map(g=>opt(g,g,st.genre)).join('')}</select></label>
   <label class="fl"><span>Lingua</span><select id="f-lang">${opt('','Tutte le lingue',st.lang)}${LANGS.map(g=>opt(g,g,st.lang)).join('')}</select></label>
   <label class="fl"><span>Qualità</span><select id="f-res">${opt('','Tutte',st.res)}${opt('HD','HD e 4K',st.res)}${opt('UHD','Solo 4K',st.res)}${opt('SD','Solo SD',st.res)}</select></label>
   <label class="fl"><span>Stato</span><select id="f-stato">${opt('','Chiaro + parziali',st.stato)}${opt('1','Solo in chiaro',st.stato)}${opt('2','Solo parzialmente in chiaro',st.stato)}</select></label>
   <label class="fl"><span>Raggruppa</span><select id="f-group">${opt('genere','Per genere',st.group)}${opt('lingua','Per lingua',st.group)}${opt('paese','Per paese',st.group)}${opt('','Nessun gruppo (A-Z)',st.group)}</select></label>
   <label class="chk"><input type="checkbox" id="f-hard"${st.hideHard?' checked':''}> Nascondi ricezione difficile da Torino</label>
   ${useMs?`<label class="chk" title="Nasconde i canali con badge MULTISTREAM o T2-MI, che una TV normale non riceve"><input type="checkbox" id="f-ms"${st.hideMs?' checked':''}> Nascondi canali che richiedono multistream / T2-MI</label>`:''}
   ${(st.genre||st.lang||st.res||st.stato||st.hideHard||st.hideMs)?'<button class="reset" id="f-reset">Azzera filtri</button>':''}
  </div>`;
}
function msBadge(x){ if(!useMs || !x.ms) return '';
  if(x.ms==='t2mi') return '<span class="bdg b-t2mi" title="Trasmesso in formato T2-MI (DVB-T2 incapsulato nel segnale satellitare): serve un ricevitore (es. Enigma2) con plugin T2-MI. Non visibile su una TV normale.">T2-MI</span>';
  if(x.ms==='mis') return `<span class="bdg b-ms" title="Su un transponder multistream${x.pls?' con codice PLS':''}: serve un ricevitore con tuner multistream (MIS)${x.pls?' e impostazione PLS':''}. Un televisore normale di solito non lo riceve.${x.isi!=null?' Stream ID (ISI): '+x.isi+'.':''}">MULTISTREAM</span>`;
  return '<span class="bdg b-msok" title="Il transponder è multistream, ma questo canale è nel flusso principale (quello che KingOfSat riceve di default, ISI più basso): di solito si vede anche con una TV o un decoder normale.">OK TV NORMALE</span>'; }
api.msBadge = msBadge;
function contOK(x){ return !useCont || st.conts.has(x.cont || 'Non specificato'); }
api.contOK = contOK;
function pass(x){
  if(!contOK(x)) return false;
  if(useMs && st.hideMs && (x.ms==='mis' || x.ms==='t2mi')) return false;
  if(st.genre && x.g!==st.genre) return false;
  if(st.lang && !x.l.includes(st.lang)) return false;
  if(st.res==='HD' && x.r==='SD') return false;
  if(st.res && st.res!=='HD' && x.r!==st.res) return false;
  if(st.stato && String(x.s)!==st.stato) return false;
  if(st.hideHard && x.hard) return false;
  if(st.q){ const t = fold(st.q).split(/\s+/).filter(Boolean); if(!t.every(w=>x.f.includes(w))) return false; }
  return true;
}
function groupKey(x){ return st.group==='genere' ? (x.g||'Non definito') : st.group==='lingua' ? (x.l[0]||'Lingua non definita') : st.group==='paese' ? (x.c||'Paese non definito') : ''; }
function listHTML(items, isAgg){
  items.sort((a,b)=>a.n.localeCompare(b.n,'it',{sensitivity:'base'}));
  let html=''; let shown=0;
  if(st.group){
    const g = new Map(); items.forEach(x=>{const k=groupKey(x); if(!g.has(k)) g.set(k,[]); g.get(k).push(x);});
    const keys=[...g.keys()].sort((a,b)=>g.get(b).length-g.get(a).length);
    html += `<nav class="gjump">${keys.map(k=>`<a href="#g-${encodeURIComponent(k)}" data-jump="${esc(k)}">${esc(k)} <small>${g.get(k).length}</small></a>`).join('')}</nav>`;
    for(const k of keys){ if(shown>=st.limit) break; const arr=g.get(k).slice(0, st.limit-shown); shown+=arr.length;
      html += `<section class="grp" id="g-${encodeURIComponent(k)}"><h2 class="gh">${esc(k)} <small>${g.get(k).length}</small></h2><div class="list">${arr.map(x=>isAgg?card(null,x):card(x,null)).join('')}</div></section>`; }
  } else { const arr=items.slice(0,st.limit); shown=arr.length; html += `<div class="list">${arr.map(x=>isAgg?card(null,x):card(x,null)).join('')}</div>`; }
  if(items.length>shown) html += `<button class="more" id="more">Mostra altri (${items.length-shown})</button>`;
  if(!items.length) html += `<p class="empty">Nessun canale trovato con questi filtri.</p>`;
  return html;
}
function satInfoHTML(s){
  const ch = CH.filter(c=>c.p===s.pos && contOK(c));
  return `<div class="satinfo"><div><h1>${esc(s.nome)}</h1><p>${esc(s.satelliti)}</p></div>
   <ul class="kpi"><li><b>${ch.length}</b><span>canali in chiaro</span></li><li><b>${ch.filter(c=>c.r==='HD').length}</b><span>HD</span></li><li><b>${ch.filter(c=>c.r==='UHD').length}</b><span>4K</span></li><li><b>${ch.filter(c=>c.s===2).length}</b><span>parziali</span></li>${useMs&&ch.some(c=>c.ms==='mis'||c.ms==='t2mi')?`<li title="Canali che richiedono tuner multistream o plugin T2-MI"><b>${ch.filter(c=>c.ms==='mis'||c.ms==='t2mi').length}</b><span>multistream / T2-MI</span></li>`:''}
   <li title="Puntamento indicativo da Torino"><b>${s.az}° / ${s.el}°</b><span>azimut / elevazione da Torino</span></li></ul></div>`;
}
function viewSat(){
  const s = SAT[st.sat]; const items = CH.filter(c=>c.p===st.sat && pass(c));
  return { controls: filtersHTML(), head: satInfoHTML(s), body: `<p class="count">${items.length} canali${st.q?` per “${esc(st.q)}”`:''}</p>` + listHTML(items,false) };
}
function viewAll(){
  const items = [...AGG.values()].filter(pass);
  return { controls: filtersHTML(), head: `<div class="satinfo"><div><h1>${st.q?'Risultati ricerca':'Tutti i canali'}</h1><p>${st.q?`Ricerca “${esc(st.q)}” su tutti i ${D.sats.length} satelliti`:`Ogni canale con i satelliti dove è in chiaro`}</p></div><ul class="kpi"><li><b>${AGG.size}</b><span>canali unici</span></li><li><b>${CH.length}</b><span>presenze sui satelliti</span></li></ul></div>`,
    body: `<p class="count">${items.length} canali</p>` + listHTML(items,true) };
}
function resolveCountries(text){
  const out=new Set(); fold(text).split(/[,;\/+]|\s+e\s+|\s+/).map(t=>t.trim()).filter(t=>t.length>1).forEach(t=>{
    PUBC.forEach(p=>{ if(fold(p).includes(t)) out.add(p); });
    Object.entries(ADJ).forEach(([k,v])=>{ if(t.startsWith(k) && PUBC.includes(v)) out.add(v); });
  }); return out;
}
function viewPub(){
  const groups = new Map();
  AGG.forEach(a=>{ if(!a.pub || !st.pubSel.has(a.pub[0]) || !contOK(a)) return; if(st.q && !fold(a.f).includes(fold(st.q))) return;
    const its = a.items.filter(x=>x.pub && (st.pubPart || x.s===1) && (!st.hideHard || !x.hard) && !(useMs && st.hideMs && (x.ms==='mis'||x.ms==='t2mi'))); if(!its.length) return;
    const k=a.pub[0]; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push({a,its}); });
  const controls = `<div class="pubctl">
    <label class="fl wide"><span>Scrivi i paesi (es. “canali francesi, tedeschi”)</span><input id="pub-text" placeholder="es. francesi, spagnoli, greci…" autocomplete="off"></label>
    <div class="chips">${PUBC.map(p=>`<button class="chip${st.pubSel.has(p)?' on':''}" data-pubc="${esc(p)}">${esc(p)}</button>`).join('')}</div>
    <div class="row"><button class="reset" data-pubset="all">Seleziona tutti</button><button class="reset" data-pubset="none">Nessuno</button>
    <label class="chk"><input type="checkbox" id="pub-part"${st.pubPart?' checked':''}> Conta anche i satelliti dove è solo parzialmente in chiaro</label>
    <label class="chk"><input type="checkbox" id="f-hard"${st.hideHard?' checked':''}> Nascondi ricezione difficile da Torino</label>
    ${useMs?`<label class="chk"><input type="checkbox" id="f-ms"${st.hideMs?' checked':''}> Nascondi canali che richiedono multistream / T2-MI</label>`:''}</div></div>`;
  const keys=[...groups.keys()].sort((a,b)=>a.localeCompare(b,'it'));
  let body = keys.length ? '' : '<p class="empty">Seleziona uno o più paesi qui sopra.</p>';
  for(const k of keys){ const arr=groups.get(k).sort((x,y)=>x.a.n.localeCompare(y.a.n,'it'));
    body += `<section class="grp"><h2 class="gh">${esc(k)} <small>${arr.length} canali</small></h2><div class="publist">${arr.map(({a,its})=>
      (SKIN.pubRow? SKIN.pubRow(a,its) : `<div class="pubrow" style="--h:${hue(a.n)}"><div class="pn">${flagHTML(a,"sm")}<div><b class="cn">${esc(a.n)}</b><small>${esc(a.pub[1])}${a.g?' · '+esc(a.g):''}</small></div></div><div class="ps">${its.map(x=>badgeSat(x,true)).join('')}</div></div>`)).join('')}</div></section>`; }
  return { controls, head:`<div class="satinfo"><div><h1>Canali pubblici europei</h1><p>Per ogni canale: i satelliti dove è <b>in chiaro</b> (badge tratteggiato = parzialmente in chiaro)</p></div></div>`, body };
}
function viewNews(){
  const base = D.ev.filter(e=> contOK({cont:e.co}) && (!st.q || fold(e.n+' '+e.c).includes(fold(st.q))) &&
    (!st.nDays || (Date.parse(D.meta.aggiornato.slice(0,10)) - Date.parse(e.d))/864e5 <= +st.nDays));
  const evs = base.filter(e=> (!st.nSat || e.p===st.nSat) && (!st.nType || e.t===st.nType));
  const controls = `<div class="filters">
    <div class="chips">${['',...D.sats.map(s=>s.pos)].map(p=>`<button class="chip${st.nSat===p?' on':''}" data-nsat="${p}">${p?esc(SAT[p].nome):'Tutti i satelliti'} <small>${p?base.filter(e=>e.p===p).length:base.length}</small></button>`).join('')}</div>
    <label class="fl"><span>Tipo</span><select id="n-type">${opt('','Entrate e uscite',st.nType)}${opt('entrata','Solo entrate',st.nType)}${opt('uscita','Solo uscite',st.nType)}</select></label>
    <label class="fl"><span>Periodo</span><select id="n-days">${opt('','Tutto (≈ ultimo mese)',st.nDays)}${opt('7','Ultimi 7 giorni',st.nDays)}${opt('14','Ultimi 14 giorni',st.nDays)}</select></label></div>`;
  let body='', last='';
  if(!evs.length) body='<p class="empty">Nessuna entrata o uscita per questa selezione nel periodo coperto dai dati.</p>';
  body += '<div class="timeline">';
  evs.forEach(e=>{ const T=TYPES[e.t]; if(e.d!==last){ last=e.d; body+=`<h3 class="tday">${new Date(e.d+'T12:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3>`; }
    const fx = {n:e.n, c:e.c, iso:e.iso};
    body += SKIN.newsRow ? SKIN.newsRow(e,T) : `<div class="ev ev-${T[1]}"><span class="evt">${T[1]==='in'?'▲':'▼'} ${esc(T[0])}</span>${useFlags?flagHTML(fx,'xs'):''}<b class="evn cn">${esc(e.n)}</b>${e.r?resBadge(e.r):''}<span class="evm">${esc(SAT[e.p].nome)}${e.c?' · '+esc(e.c):''}${e.ch?' · non più trasmesso in Europa':''}</span></div>`; });
  body += '</div>';
  return { controls, head:`<div class="satinfo"><div><h1>Novità</h1><p>Solo canali <b>in chiaro</b> entrati o usciti dai satelliti · dati KingOfSat fino al ${esc(fmtDate(D.meta.aggiornato))}</p></div><ul class="kpi"><li><b>${base.filter(e=>e.t==='entrata').length}</b><span>entrate</span></li><li><b>${base.filter(e=>e.t==='uscita').length}</b><span>uscite</span></li></ul></div>`, body };
}
function fmtDate(s){ const m=/^(\d{4})-(\d\d)-(\d\d)(?: (\d\d:\d\d))?/.exec(s||''); if(!m) return s||'';
  const d=new Date(+m[1], +m[2]-1, +m[3]); return d.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})+(m[4]?', ore '+m[4]:''); }
function contBar(){ const el=$('#contsel'); if(!el || !useCont) return;
  const cnt={}; AGG.forEach(a=>{ cnt[a.cont]=(cnt[a.cont]||0)+1; });
  el.innerHTML = `<span class="ctl-l">Continenti</span>` + CONTS.map(([c,ic])=>`<button class="cont${st.conts.has(c)?' on':''}" data-cont="${esc(c)}" aria-pressed="${st.conts.has(c)}" title="${st.conts.has(c)?'Nascondi':'Mostra'} i canali di ${c==='Non specificato'?'paese non specificato / internazionali':esc(c)}"><span class="ci">${ic}</span>${c==='Non specificato'?'Internaz. / n.d.':esc(c)} <small>${cnt[c]||0}</small></button>`).join('');
}
function render(){
  const v = st.view==='sat' && st.q ? viewAll() : ({sat:viewSat, all:viewAll, pub:viewPub, news:viewNews}[st.view])();
  const ctl=$('#controls'), head=$('#head'), res=$('#results');
  if(ctl) ctl.innerHTML = v.controls; if(head) head.innerHTML = v.head; if(res) res.innerHTML = v.body;
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on', b.dataset.view===st.view));
  document.body.dataset.view = st.view;
  contBar();
  if(SKIN.renderSatSelector) SKIN.renderSatSelector($('#satsel'), D.sats, st.sat, api); else defaultSatSel();
  if(SKIN.after) SKIN.after(api);
}
function defaultSatSel(){ const el=$('#satsel'); if(!el) return;
  el.innerHTML = D.sats.map(s=>`<button class="satbtn${s.pos===st.sat&&st.view==='sat'?' on':''}" data-sat="${s.pos}"><b>${esc(s.nome)}</b><small>${CH.filter(c=>c.p===s.pos && contOK(c)).length} canali</small></button>`).join(''); }
function setSat(p){ st.sat=p; st.view='sat'; st.limit=240; st.q=''; const q=$('#q'); if(q) q.value=''; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function setView(v){ st.view=v; st.limit=240; render(); }
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-cont],[data-sat],[data-gosat],[data-view]:not(body),[data-pubc],[data-pubset],[data-nsat],#more,#f-reset,[data-jump]'); if(!t) return;
  if(t.dataset.cont){ const c=t.dataset.cont; st.conts.has(c)?st.conts.delete(c):st.conts.add(c); try{ localStorage.setItem(CONT_KEY, JSON.stringify([...st.conts])); }catch(_){} st.limit=240; render(); return; }
  if(t.dataset.jump!==undefined){ e.preventDefault(); const el=document.getElementById('g-'+encodeURIComponent(t.dataset.jump)); if(el) el.scrollIntoView({behavior:'smooth'}); return; }
  if(t.dataset.sat){ setSat(t.dataset.sat); return; }
  if(t.dataset.gosat){ setSat(t.dataset.gosat); return; }
  if(t.dataset.view){ setView(t.dataset.view); return; }
  if(t.dataset.pubc){ const p=t.dataset.pubc; st.pubSel.has(p)?st.pubSel.delete(p):st.pubSel.add(p); render(); return; }
  if(t.dataset.pubset){ st.pubSel = t.dataset.pubset==='all'? new Set(PUBC) : new Set(); render(); return; }
  if(t.dataset.nsat!==undefined){ st.nSat=t.dataset.nsat; render(); return; }
  if(t.id==='more'){ st.limit+=400; render(); return; }
  if(t.id==='f-reset'){ Object.assign(st,{genre:'',lang:'',res:'',stato:'',hideHard:false,hideMs:false}); render(); }
});
document.addEventListener('change', e=>{ const t=e.target; const map={'f-genre':'genre','f-lang':'lang','f-res':'res','f-stato':'stato','f-group':'group','n-type':'nType','n-days':'nDays'};
  if(map[t.id]){ st[map[t.id]]=t.value; st.limit=240; render(); }
  else if(t.id==='f-hard'){ st.hideHard=t.checked; render(); }
  else if(t.id==='f-ms'){ st.hideMs=t.checked; render(); }
  else if(t.id==='pub-part'){ st.pubPart=t.checked; render(); }
  else if(t.id==='satsel-select'){ setSat(t.value); } });
let qt; document.addEventListener('input', e=>{ const t=e.target;
  if(t.id==='q'){ clearTimeout(qt); qt=setTimeout(()=>{ st.q=t.value.trim(); st.limit=240; if(st.q && st.view==='sat') {} render(); }, 160); }
  if(t.id==='pub-text'){ const s=resolveCountries(t.value); if(s.size){ st.pubSel=s; const v=t.value; render(); const n=$('#pub-text'); n.value=v; n.focus(); } } });
document.addEventListener('keydown', e=>{ if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); $('#q')?.focus(); } });
// --- dimensione nomi canali (A− / A+) e pulsante "torna su" ---
const FS_STEPS=[0.8,0.9,1,1.1,1.25,1.4,1.6,1.8,2]; const FS_KEY='satTorino.fontScale';
let fsIdx = (()=>{ try{ const v=parseFloat(localStorage.getItem(FS_KEY)); const i=FS_STEPS.indexOf(v); return i>=0?i:2; }catch(_){ return 2; } })();
function applyFs(){ const v=FS_STEPS[fsIdx]; document.documentElement.style.setProperty('--fs', v); try{ localStorage.setItem(FS_KEY, v); }catch(_){}
  const p=$('#fs-val'); if(p) p.textContent=Math.round(v*100)+'%';
  const m=$('#fs-minus'), pl=$('#fs-plus'); if(m) m.disabled=fsIdx===0; if(pl) pl.disabled=fsIdx===FS_STEPS.length-1; }
api.fontScale = ()=>FS_STEPS[fsIdx];
function mountTools(){
  const fc=document.createElement('div'); fc.id='fontctl'; fc.setAttribute('role','group'); fc.setAttribute('aria-label','Dimensione nomi dei canali');
  fc.innerHTML='<button id="fs-minus" title="Rimpicciolisci i nomi dei canali" aria-label="Rimpicciolisci testo">A−</button><button id="fs-reset" title="Dimensione normale (100%)"><span id="fs-val">100%</span></button><button id="fs-plus" title="Ingrandisci i nomi dei canali" aria-label="Ingrandisci testo">A+</button>';
  const slot=$('#fontslot'); if(slot){ slot.appendChild(fc); } else { fc.classList.add('float'); document.body.appendChild(fc); }
  const tt=document.createElement('button'); tt.id='totop'; tt.title='Torna su'; tt.setAttribute('aria-label','Torna su'); tt.innerHTML='<span>↑</span>';
  if(!slot) document.body.classList.add('fc-float'); document.body.appendChild(tt);
  fc.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.id==='fs-minus' && fsIdx>0) fsIdx--; else if(b.id==='fs-plus' && fsIdx<FS_STEPS.length-1) fsIdx++; else if(b.id==='fs-reset') fsIdx=2; applyFs(); });
  tt.addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));
  const onScroll=()=>tt.classList.toggle('show', window.scrollY>500); window.addEventListener('scroll', onScroll, {passive:true}); onScroll();
  applyFs();
}
document.addEventListener('DOMContentLoaded', ()=>{ mountTools(); const m=$('#meta'); if(m) m.innerHTML=`Dati: ${esc(D.meta.fonte)} · aggiornati il ${esc(fmtDate(D.meta.aggiornato))} (ora di Roma) · ${CH.length} presenze, ${AGG.size} canali unici`; const lu=$('#lastupd'); if(lu) lu.textContent='Ultimo aggiornamento: '+fmtDate(D.meta.aggiornato)+' (ora di Roma)'; if(SKIN.init) SKIN.init(api); render(); });
})();
</script></body></html>
